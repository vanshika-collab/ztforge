# ZTForge — Docker Compose multi-service stack
# Usage: docker compose up --build
# Services: backend, frontend, postgres, redis, keycloak, opa

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ztforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ztforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Don't expose to host in production
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Keycloak ────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # Don't expose to host in production - access via frontend only
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ── OPA ─────────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.70.0
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - --authentication=token
      - --authorization=basic
      - /policies
    environment:
      OPA_BEARER_TOKEN: ${OPA_TOKEN:-opatoken}
    volumes:
      - ./opa/policies:/policies:ro
    # Don't expose to host in production
    # ports:
    #   - "8181:8181"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header=Authorization: Bearer ${OPA_TOKEN:-opatoken}", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://ztforge:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/ztforge
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ztforge
      KEYCLOAK_CLIENT_ID: ztforge-app
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production-please}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: INFO
      OPA_URL: http://opa:8181
      OPA_TOKEN: ${OPA_TOKEN:-opatoken}
      ENABLE_BREACH_SIMULATION: "true"
      ENABLE_POLICY_HUB: "true"
      # Accept tokens issued by localhost:8080 (browser) even though backend uses keycloak:8080
      KEYCLOAK_ISSUER_OVERRIDE: "http://localhost:8080/realms/ztforge"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - keycloak
    restart: unless-stopped

volumes:
  pgdata:
